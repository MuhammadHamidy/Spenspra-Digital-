events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Performance Tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 25M;

  # Gzip Compression Tuning
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    font/eot
    font/otf
    font/ttf
    image/svg+xml;

  # Static Proxy Cache Path for Next.js (10MB memory zone, 7 days inactive)
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

  # Docker Embedded DNS Resolver (Auto-update container IP on recreate)
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Persistent Upstream Connections (Keepalive)
  upstream sso_frontend {
    server sso-frontend:3000;
    keepalive 32;
  }
  upstream sso_api {
    server sso-api:8080;
    keepalive 32;
  }
  upstream rapor_frontend {
    server rapor-frontend:3000;
    keepalive 32;
  }
  upstream rapor_api {
    server rapor-api:8080;
    keepalive 32;
  }
  upstream perpus_frontend {
    server perpus-frontend:3000;
    keepalive 32;
  }
  upstream perpus_api {
    server perpus-api:8080;
    keepalive 32;
  }

  # Security Headers (Hardening against Clickjacking, MIME-Sniffing, XSS)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ============================================================================
  # 1. SSO Portal & Auth Service
  # ============================================================================
  server {
    listen 80 default_server;
    server_name localhost sso.localhost sso.spenspra.sch.id;

    # Static Assets Cache (Next.js Chunks & Public Files)
    location /_next/static/ {
      proxy_cache STATIC;
      proxy_pass http://sso_frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Centralized Monorepo Shared Assets (Direct Nginx disk delivery, zero Node.js overhead)
    location /icon/ {
      alias /var/www/shared/assets/icon/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /image/ {
      alias /var/www/shared/assets/image/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /images/ {
      alias /var/www/shared/assets/image/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /assets/ {
      alias /var/www/shared/assets/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location = /new_logo_prambon.png {
      alias /var/www/shared/assets/image/new_logo_prambon.png;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location = /logo-prambon.png {
      alias /var/www/shared/assets/image/logo-prambon.png;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /api/email/ {
      proxy_pass http://sso_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://sso_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://sso_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

