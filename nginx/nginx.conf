events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Performance Tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 25M;
  large_client_header_buffers 4 32k;

  # Gzip Compression Tuning
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    font/eot
    font/otf
    font/ttf
    image/svg+xml;

  # Static Proxy Cache Path for Next.js (10MB memory zone, 7 days inactive)
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;
  proxy_cache_key "$scheme$host$request_uri";

  # Docker Embedded DNS Resolver (Auto-update container IP on recreate)
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;

  # Security Headers (Hardening against Clickjacking, MIME-Sniffing, XSS)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # ============================================================================
  # GLOBAL SSL CONFIGURATION (Cloudflare Origin CA Certificate)
  # Berlaku otomatis untuk semua subdomain (sso, rapor, perpus)
  # ============================================================================
  ssl_certificate     /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # ============================================================================
  # 1. SSO Portal & Auth Service
  # ============================================================================
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name localhost sso.localhost sso.spenspra.com sso.spenspra.sch.id ~^sso\..+$ spenspra.com www.spenspra.com spenspra.sch.id www.spenspra.sch.id;

    set $sso_fe "http://sso-frontend:3000";
    set $sso_be "http://sso-api:8080";

    # Static Assets Cache (Next.js Chunks & Public Files)
    location /_next/static/ {
      proxy_cache STATIC;
      proxy_pass $sso_fe;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Centralized Monorepo Shared Assets (Direct Nginx disk delivery, zero Node.js overhead)
    location /icon/ {
      alias /var/www/shared/assets/icon/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /image/ {
      alias /var/www/shared/assets/image/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /images/ {
      alias /var/www/shared/assets/image/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /assets/ {
      alias /var/www/shared/assets/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location = /new_logo_prambon.png {
      alias /var/www/shared/assets/image/new_logo_prambon.png;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location = /logo-prambon.png {
      alias /var/www/shared/assets/image/logo-prambon.png;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /api/email/ {
      proxy_pass $sso_fe;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
      proxy_pass $sso_be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      proxy_pass $sso_fe;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

