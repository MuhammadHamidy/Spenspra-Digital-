services:
  postgres-sso:
    image: postgres:15-alpine
    container_name: spenspra-postgres-sso
    environment:
      POSTGRES_USER: ${SSO_DB_USER:-user}
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${SSO_DB_NAME:-presdig}
    volumes:
      - sso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SSO_DB_USER:-user} -d ${SSO_DB_NAME:-presdig}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [spenspra]

  sso-migrate:
    image: migrate/migrate
    container_name: spenspra-sso-migrate
    volumes:
      - ./sso/backend_fr/sso/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "postgres://${SSO_DB_USER:-user}:${SSO_DB_PASSWORD:-change-me}@postgres-sso:5432/${SSO_DB_NAME:-presdig}?sslmode=disable", "up"]
    depends_on:
      postgres-sso:
        condition: service_healthy
    networks: [spenspra]

  sso-seeder:
    image: postgres:15-alpine
    container_name: spenspra-sso-seeder
    volumes:
      - ./sso/backend_fr/sso/seeders:/seeders:ro
    command: ["sh", "-c", "for f in /seeders/*.sql; do psql -h postgres-sso -U \"$${POSTGRES_USER:-user}\" -d \"$${POSTGRES_DB:-presdig}\" -f \"$$f\"; done"]
    environment:
      POSTGRES_USER: ${SSO_DB_USER:-user}
      POSTGRES_DB: ${SSO_DB_NAME:-presdig}
      PGPASSWORD: ${SSO_DB_PASSWORD:-change-me}
    depends_on:
      sso-migrate:
        condition: service_completed_successfully
    networks: [spenspra]

  sso-api:
    build:
      context: ./sso/backend_fr
      dockerfile: sso/Dockerfile
    container_name: spenspra-sso-api
    environment:
      APP_NAME: sso
      APP_ENV: production
      APP_PORT: 8080
      APP_POSTGRES_URL: postgres://${SSO_DB_USER:-user}:${SSO_DB_PASSWORD:-change-me}@postgres-sso:5432/${SSO_DB_NAME:-presdig}?sslmode=disable
      APP_REDIS_ADDRESS: redis:6379
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: 0
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SERVICE_NAME: sso
      WA_API_KEY: ${WA_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-SMPN 1 Prambon - Presensi Digital}
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://sso.localhost/login}
    depends_on:
      sso-seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [spenspra]

  sso-frontend:
    build:
      context: ./sso/frontend_fr
      dockerfile: Dockerfile
      target: final
      args:
        NEXT_PUBLIC_API_URL: ${SSO_PUBLIC_API_URL:-http://sso.localhost/api}
        NEXT_PUBLIC_RAPOR_API_URL: ${RAPOR_PUBLIC_API_URL:-http://rapor.localhost/api}
        NEXT_PUBLIC_PERPUS_API_URL: ${PERPUS_PUBLIC_API_URL:-http://perpus.localhost/api}
    container_name: spenspra-sso-frontend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${SSO_PUBLIC_API_URL:-http://sso.localhost/api}
      NEXT_PUBLIC_RAPOR_API_URL: ${RAPOR_PUBLIC_API_URL:-http://rapor.localhost/api}
      NEXT_PUBLIC_PERPUS_API_URL: ${PERPUS_PUBLIC_API_URL:-http://perpus.localhost/api}
      DATABASE_URL: postgresql://${SSO_DB_USER:-user}:${SSO_DB_PASSWORD:-change-me}@postgres-sso:5432/${SSO_DB_NAME:-presdig}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env.docker}
      WA_API_KEY: ${WA_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://sso.localhost/login}
    command: ["node", "server.js"]
    depends_on: [sso-api]
    networks: [spenspra]

  postgres-rapor:
    image: postgres:15-alpine
    container_name: spenspra-postgres-rapor
    environment:
      POSTGRES_USER: ${RAPOR_DB_USER:-user}
      POSTGRES_PASSWORD: ${RAPOR_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${RAPOR_DB_NAME:-presdig}
    volumes:
      - rapor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAPOR_DB_USER:-user} -d ${RAPOR_DB_NAME:-presdig}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [spenspra]

  rapor-migrate:
    image: migrate/migrate
    container_name: spenspra-rapor-migrate
    volumes:
      - ./rapor/backend_fr/rapor/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "postgres://${RAPOR_DB_USER:-user}:${RAPOR_DB_PASSWORD:-change-me}@postgres-rapor:5432/${RAPOR_DB_NAME:-presdig}?sslmode=disable", "up"]
    depends_on:
      postgres-rapor:
        condition: service_healthy
    networks: [spenspra]

  rapor-seeder:
    image: postgres:15-alpine
    container_name: spenspra-rapor-seeder
    volumes:
      - ./rapor/backend_fr/rapor/seeders:/seeders:ro
    environment:
      POSTGRES_USER: ${RAPOR_DB_USER:-user}
      POSTGRES_DB: ${RAPOR_DB_NAME:-presdig}
      PGPASSWORD: ${RAPOR_DB_PASSWORD:-change-me}
    command: ["sh", "-c", "for f in /seeders/*.sql; do psql -h postgres-rapor -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -f \"$$f\"; done"]
    depends_on:
      rapor-migrate:
        condition: service_completed_successfully
    networks: [spenspra]

  rapor-api:
    build:
      context: ./rapor/backend_fr
      dockerfile: rapor/Dockerfile
    container_name: spenspra-rapor-api
    environment:
      APP_NAME: rapor
      APP_ENV: production
      APP_PORT: 8080
      APP_POSTGRES_URL: postgres://${RAPOR_DB_USER:-user}:${RAPOR_DB_PASSWORD:-change-me}@postgres-rapor:5432/${RAPOR_DB_NAME:-presdig}?sslmode=disable
      APP_REDIS_ADDRESS: redis:6379
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: 1
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SERVICE_NAME: rapor
      WA_API_KEY: ${WA_API_KEY:-}
      SSO_API_URL: http://sso-api:8080
    depends_on:
      rapor-seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sso-api:
        condition: service_started
    networks: [spenspra]

  rapor-frontend:
    build:
      context: ./rapor/frontend_fr
      dockerfile: Dockerfile
      target: final
      args:
        NEXT_PUBLIC_API_URL: ${RAPOR_PUBLIC_API_URL:-http://rapor.localhost/api}
    container_name: spenspra-rapor-frontend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${RAPOR_PUBLIC_API_URL:-http://rapor.localhost/api}
      NEXT_PUBLIC_SSO_LOGIN_URL: ${SSO_LOGIN_URL:-http://sso.localhost/login}
      DATABASE_URL: postgresql://${RAPOR_DB_USER:-user}:${RAPOR_DB_PASSWORD:-change-me}@postgres-rapor:5432/${RAPOR_DB_NAME:-presdig}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env.docker}
      WA_API_KEY: ${WA_API_KEY:-}
    command: ["node", "server.js"]
    depends_on: [rapor-api]
    networks: [spenspra]

  postgres-perpus:
    image: postgres:15-alpine
    container_name: spenspra-postgres-perpus
    environment:
      POSTGRES_USER: ${PERPUS_DB_USER:-user}
      POSTGRES_PASSWORD: ${PERPUS_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${PERPUS_DB_NAME:-perpusdig}
    volumes:
      - perpus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERPUS_DB_USER:-user} -d ${PERPUS_DB_NAME:-perpusdig}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [spenspra]

  perpus-migrate:
    image: migrate/migrate
    container_name: spenspra-perpus-migrate
    volumes:
      - ./perpus/backend_fr/facerec/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "postgres://${PERPUS_DB_USER:-user}:${PERPUS_DB_PASSWORD:-change-me}@postgres-perpus:5432/${PERPUS_DB_NAME:-perpusdig}?sslmode=disable", "up"]
    depends_on:
      postgres-perpus:
        condition: service_healthy
    networks: [spenspra]

  perpus-seeder:
    image: postgres:15-alpine
    container_name: spenspra-perpus-seeder
    volumes:
      - ./perpus/backend_fr/facerec/seeders:/seeders:ro
    environment:
      POSTGRES_USER: ${PERPUS_DB_USER:-user}
      POSTGRES_DB: ${PERPUS_DB_NAME:-perpusdig}
      PGPASSWORD: ${PERPUS_DB_PASSWORD:-change-me}
    command: ["sh", "-c", "for f in /seeders/*.sql; do psql -h postgres-perpus -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -f \"$$f\"; done"]
    depends_on:
      perpus-migrate:
        condition: service_completed_successfully
    networks: [spenspra]

  perpus-api:
    build:
      context: ./perpus/backend_fr
      dockerfile: facerec/Dockerfile
    container_name: spenspra-perpus-api
    environment:
      APP_NAME: perpus
      APP_ENV: production
      APP_PORT: 8080
      APP_POSTGRES_URL: postgres://${PERPUS_DB_USER:-user}:${PERPUS_DB_PASSWORD:-change-me}@postgres-perpus:5432/${PERPUS_DB_NAME:-perpusdig}?sslmode=disable
      APP_REDIS_ADDRESS: redis:6379
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: 2
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SERVICE_NAME: perpus
      WA_API_KEY: ${WA_API_KEY:-}
      SSO_API_URL: http://sso-api:8080
    depends_on:
      perpus-seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sso-api:
        condition: service_started
    networks: [spenspra]

  perpus-frontend:
    build:
      context: ./perpus/frontend_fr
      dockerfile: Dockerfile
      target: final
      args:
        NEXT_PUBLIC_API_URL: ${PERPUS_PUBLIC_API_URL:-http://perpus.localhost/api}
    container_name: spenspra-perpus-frontend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${PERPUS_PUBLIC_API_URL:-http://perpus.localhost/api}
      DATABASE_URL: postgresql://${PERPUS_DB_USER:-user}:${PERPUS_DB_PASSWORD:-change-me}@postgres-perpus:5432/${PERPUS_DB_NAME:-perpusdig}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env.docker}
      WA_API_KEY: ${WA_API_KEY:-}
    command: ["node", "server.js"]
    depends_on:
      perpus-api:
        condition: service_started
    networks: [spenspra]

  redis:
    image: redis:7-alpine
    container_name: spenspra-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [spenspra]

  nginx:
    image: nginx:1.27-alpine
    container_name: spenspra-nginx
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sso-frontend:
        condition: service_started
      rapor-frontend:
        condition: service_started
      perpus-frontend:
        condition: service_started
      sso-api:
        condition: service_started
      rapor-api:
        condition: service_started
      perpus-api:
        condition: service_started
    networks: [spenspra]

volumes:
  sso-postgres-data:
  rapor-postgres-data:
  perpus-postgres-data:
  redis-data:

networks:
  spenspra:
    name: spenspra
